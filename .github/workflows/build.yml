name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/example/videowall app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VideoWall"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.videowall'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.videowall'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application
                  android:label="Video Wallpaper"
                  android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".VideoWallpaperService"
                      android:exported="true"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/wallpaper.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat > app/src/main/java/com/example/videowall/MainActivity.java <<'EOF'
          package com.example.videowall;

          import android.app.Activity;
          import android.app.WallpaperManager;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              TextView status;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(48, 48, 48, 48);
                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setTextSize(16);
                  Button pick = new Button(this);
                  pick.setText("Choose video");
                  Button set = new Button(this);
                  set.setText("Set as wallpaper");
                  l.addView(status);
                  l.addView(pick);
                  l.addView(set);
                  setContentView(l);
                  refresh();

                  pick.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("video/*");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                              | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                      startActivityForResult(i, 1);
                  });

                  set.setOnClickListener(v -> {
                      if (getSharedPreferences("v", MODE_PRIVATE).getString("video", null) == null) {
                          Toast.makeText(this, "Choose a video first", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      try {
                          Intent i = new Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER);
                          i.putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT,
                                  new ComponentName(this, VideoWallpaperService.class));
                          startActivity(i);
                      } catch (Exception e) {
                          startActivity(new Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER));
                      }
                  });
              }

              void refresh() {
                  String s = getSharedPreferences("v", MODE_PRIVATE).getString("video", null);
                  status.setText(s == null ? "No video chosen yet" : "Video selected");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == 1 && res == RESULT_OK && data != null && data.getData() != null) {
                      Uri u = data.getData();
                      try {
                          getContentResolver().takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) {
                      }
                      getSharedPreferences("v", MODE_PRIVATE).edit()
                              .putString("video", u.toString()).apply();
                      refresh();
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/videowall/VideoWallpaperService.java <<'EOF'
          package com.example.videowall;

          import android.media.MediaPlayer;
          import android.net.Uri;
          import android.service.wallpaper.WallpaperService;
          import android.view.SurfaceHolder;

          public class VideoWallpaperService extends WallpaperService {
              @Override
              public Engine onCreateEngine() {
                  return new VideoEngine();
              }

              class VideoEngine extends Engine {
                  MediaPlayer mp;

                  void start(SurfaceHolder h) {
                      release();
                      String s = getSharedPreferences("v", MODE_PRIVATE).getString("video", null);
                      if (s == null || h == null || !h.getSurface().isValid()) return;
                      try {
                          mp = new MediaPlayer();
                          mp.setSurface(h.getSurface());
                          mp.setDataSource(getApplicationContext(), Uri.parse(s));
                          mp.setLooping(true);
                          mp.setVolume(0f, 0f);
                          mp.setVideoScalingMode(MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING);
                          mp.setOnPreparedListener(p -> p.start());
                          mp.prepareAsync();
                      } catch (Exception e) {
                          release();
                      }
                  }

                  void release() {
                      if (mp != null) {
                          try {
                              mp.release();
                          } catch (Exception ignored) {
                          }
                          mp = null;
                      }
                  }

                  @Override
                  public void onSurfaceCreated(SurfaceHolder h) {
                      super.onSurfaceCreated(h);
                      start(h);
                  }

                  @Override
                  public void onVisibilityChanged(boolean visible) {
                      if (visible) start(getSurfaceHolder());
                      else release();
                  }

                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder h) {
                      release();
                      super.onSurfaceDestroyed(h);
                  }
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VideoWall-APK
          path: app/build/outputs/apk/debug/app-debug.apk
